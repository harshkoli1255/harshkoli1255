<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Attendify Flagship Project Banner">
  <defs>
    <linearGradient id="attBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1128" />
      <stop offset="50%" stop-color="#12183A" />
      <stop offset="100%" stop-color="#070B18" />
    </linearGradient>

    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="40%" stop-color="#38BDF8" />
      <stop offset="80%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <filter id="attGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <clipPath id="attClip">
      <rect width="1000" height="260" rx="16" />
    </clipPath>
  </defs>

  <style>
    @keyframes soundwave {
      0%, 100% { height: 12px; transform: translateY(0); }
      50% { height: 44px; transform: translateY(-16px); }
    }
    @keyframes radarSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes ripple {
      0% { r: 10px; opacity: 0.9; }
      100% { r: 65px; opacity: 0; }
    }
    @keyframes pulsePill {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(0.98); }
    }
    .w1 { animation: soundwave 1.1s ease-in-out infinite; }
    .w2 { animation: soundwave 1.5s ease-in-out infinite 0.2s; }
    .w3 { animation: soundwave 0.9s ease-in-out infinite 0.4s; }
    .w4 { animation: soundwave 1.7s ease-in-out infinite 0.1s; }
    .w5 { animation: soundwave 1.3s ease-in-out infinite 0.3s; }
    .radar-beam { animation: radarSpin 4.5s linear infinite; transform-origin: 850px 130px; }
    .radar-wave { animation: ripple 2.8s ease-out infinite; transform-origin: 850px 130px; }
    .radar-wave2 { animation: ripple 2.8s ease-out infinite 1.4s; transform-origin: 850px 130px; }
    .live-status { animation: pulsePill 2s infinite; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <g clip-path="url(#attClip)">
    <!-- Card Background -->
    <rect width="1000" height="260" fill="url(#attBg)" stroke="#223055" stroke-width="2" />

    <!-- Ambient Grid -->
    <path d="M 0 50 L 1000 50 M 0 210 L 1000 210" stroke="#38BDF8" stroke-opacity="0.12" stroke-width="1" />
    <path d="M 320 0 L 320 260 M 680 0 L 680 260" stroke="#38BDF8" stroke-opacity="0.08" stroke-width="1" />

    <!-- Top Badge Row -->
    <g transform="translate(42, 28)">
      <rect width="135" height="24" rx="12" fill="#13233F" stroke="#38BDF8" stroke-opacity="0.4" />
      <text x="67.5" y="16" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" text-anchor="middle">★ FLAGSHIP BUILD</text>

      <rect x="145" y="0" width="160" height="24" rx="12" fill="#132F24" stroke="#10B981" stroke-opacity="0.5" class="live-status" />
      <circle cx="157" cy="12" r="3.5" fill="#10B981" />
      <text x="228" y="16" fill="#6EE7B7" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" text-anchor="middle">ZERO-PROXY VERIFIED</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(42, 92)">
      <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="url(#cyanPurple)" filter="url(#attGlow)" letter-spacing="-0.5">
        ATTENDIFY <tspan fill="#F8FAFC" font-weight="700" font-size="22">— Next-Gen Smart Attendance</tspan>
      </text>
      <text x="0" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" fill="#94A3B8">
        Hardware-bound physical verification combining Ultrasonic Acoustic DSP, FIDO2 Passkeys &amp; Live GPS Radar.
      </text>
    </g>

    <!-- 3 Core Technology Highlights -->
    <g transform="translate(42, 160)">
      <!-- Box 1: Ultrasonic -->
      <g>
        <rect width="195" height="68" rx="10" fill="#0E1A33" stroke="#818CF8" stroke-opacity="0.3" stroke-width="1.2" />
        <text x="14" y="24" fill="#C084FC" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">🔊 ULTRASONIC DSP</text>
        <text x="14" y="44" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11.5">Inaudible acoustic chords</text>
        <text x="14" y="58" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10.5">Verifies room presence</text>
      </g>

      <!-- Box 2: Passkey FIDO2 -->
      <g transform="translate(208, 0)">
        <rect width="195" height="68" rx="10" fill="#0E1A33" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1.2" />
        <text x="14" y="24" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">🔐 FIDO2 BIOMETRICS</text>
        <text x="14" y="44" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11.5">FaceID / TouchID bound</text>
        <text x="14" y="58" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10.5">Zero proxy / shared logins</text>
      </g>

      <!-- Box 3: Live Radar Map -->
      <g transform="translate(416, 0)">
        <rect width="195" height="68" rx="10" fill="#0E1A33" stroke="#00F5D4" stroke-opacity="0.3" stroke-width="1.2" />
        <text x="14" y="24" fill="#00F5D4" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">🛰️ LIVE RADAR &amp; PWA</text>
        <text x="14" y="44" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11.5">Socket.IO real-time pins</text>
        <text x="14" y="58" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10.5">Offline sync &amp; cluster ready</text>
      </g>
    </g>

    <!-- Right Side: Animated Ultrasonic Wave & Radar Display -->
    <g transform="translate(850, 130)">
      <!-- Radar Circles -->
      <circle cx="0" cy="0" r="70" fill="#091328" stroke="#38BDF8" stroke-opacity="0.25" stroke-width="1.5" />
      <circle cx="0" cy="0" r="46" fill="none" stroke="#818CF8" stroke-opacity="0.3" stroke-width="1.2" stroke-dasharray="4 4" />
      <circle cx="0" cy="0" r="24" fill="none" stroke="#00F5D4" stroke-opacity="0.4" stroke-width="1" />

      <!-- Expanding Radar Wave Rings -->
      <circle cx="0" cy="0" r="10" fill="none" stroke="#00F5D4" stroke-width="1.5" class="radar-wave" />
      <circle cx="0" cy="0" r="10" fill="none" stroke="#38BDF8" stroke-width="1.5" class="radar-wave2" />

      <!-- Rotating Scanner Beam -->
      <g class="radar-beam">
        <path d="M 0 0 L 65 -25 A 70 70 0 0 1 70 0 Z" fill="#00F5D4" fill-opacity="0.25" />
        <line x1="0" y1="0" x2="70" y2="0" stroke="#00F5D4" stroke-width="1.8" />
      </g>

      <!-- Center Pulse Dot -->
      <circle cx="0" cy="0" r="4" fill="#00F5D4" filter="url(#attGlow)" />

      <!-- Blinking Target Student Pins on Radar -->
      <circle cx="28" cy="-22" r="3" fill="#10B981" />
      <circle cx="-32" cy="18" r="3" fill="#38BDF8" />
      <circle cx="15" cy="38" r="3" fill="#C084FC" />
    </g>

    <!-- Animated Acoustic Equalizer Bars in Corner -->
    <g transform="translate(685, 42)">
      <rect x="0" y="24" width="3.5" height="12" rx="1.5" fill="#00F5D4" class="w1" />
      <rect x="7" y="24" width="3.5" height="12" rx="1.5" fill="#38BDF8" class="w2" />
      <rect x="14" y="24" width="3.5" height="12" rx="1.5" fill="#818CF8" class="w3" />
      <rect x="21" y="24" width="3.5" height="12" rx="1.5" fill="#C084FC" class="w4" />
      <rect x="28" y="24" width="3.5" height="12" rx="1.5" fill="#00F5D4" class="w5" />
      <text x="38" y="34" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600">19.5 kHz ULTRASONIC BEACON</text>
    </g>
  </g>
</svg>
