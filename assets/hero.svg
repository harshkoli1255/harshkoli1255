<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-label="Harsh Koli Futuristic Developer Banner">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="45%" stop-color="#0a0f24" />
      <stop offset="85%" stop-color="#060914" />
      <stop offset="100%" stop-color="#020409" />
    </linearGradient>

    <!-- Vibrant Aurora Neon Gradient -->
    <linearGradient id="auroraGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="35%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Accent Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Subtle Tech Grid -->
    <pattern id="gridNet" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#38BDF8" stroke-width="0.75" stroke-opacity="0.1" />
      <circle cx="30" cy="0" r="1" fill="#00F5D4" fill-opacity="0.18" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="16" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <clipPath id="bannerClip">
      <rect width="1000" height="340" rx="18" />
    </clipPath>
  </defs>

  <style>
    @keyframes spinClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spinCounter {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.75; transform: scale(1.06); }
    }
    @keyframes laserSweep {
      0% { transform: translateY(-340px); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translateY(340px); opacity: 0; }
    }
    @keyframes blinkDot {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 4px #00F5D4); }
      50% { opacity: 0.25; filter: none; }
    }
    @keyframes floatBadge {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }

    .orbit-1 { animation: spinClockwise 18s linear infinite; transform-origin: 790px 165px; }
    .orbit-2 { animation: spinCounter 12s linear infinite; transform-origin: 790px 165px; }
    .orbit-3 { animation: spinClockwise 28s linear infinite; transform-origin: 790px 165px; }
    .pulse-core { animation: pulseGlow 3.5s ease-in-out infinite; transform-origin: 790px 165px; }
    .laser-line { animation: laserSweep 5.5s ease-in-out infinite; }
    .status-dot { animation: blinkDot 1.4s infinite; }
    .float-1 { animation: floatBadge 4s ease-in-out infinite; }
    .float-2 { animation: floatBadge 4.8s ease-in-out infinite 0.7s; }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <g clip-path="url(#bannerClip)">
    <!-- Base Background -->
    <rect width="1000" height="340" fill="url(#cyberBg)" />
    <!-- Grid Overlay -->
    <rect width="1000" height="340" fill="url(#gridNet)" />

    <!-- Ambient Glow Orbs -->
    <circle cx="150" cy="80" r="140" fill="#00F5D4" fill-opacity="0.05" filter="url(#neonGlow)" />
    <circle cx="790" cy="165" r="160" fill="#818CF8" fill-opacity="0.08" filter="url(#neonGlow)" />

    <!-- Top & Bottom Glowing Border Lines -->
    <path d="M0 24 L1000 24" stroke="url(#auroraGrad)" stroke-opacity="0.3" stroke-width="1.2" />
    <path d="M0 316 L1000 316" stroke="url(#auroraGrad)" stroke-opacity="0.3" stroke-width="1.2" />

    <!-- Inner Frame Border -->
    <rect x="14" y="14" width="972" height="312" rx="14" fill="none" stroke="#38BDF8" stroke-opacity="0.22" stroke-width="1.5" />

    <!-- Left Header Content -->
    <!-- Status Pill -->
    <g transform="translate(48, 42)">
      <rect width="210" height="26" rx="13" fill="#0C1B2A" stroke="#00F5D4" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="16" cy="13" r="4.5" fill="#00F5D4" class="status-dot" />
      <text x="28" y="17.5" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#00F5D4" letter-spacing="1.2">SYSTEM OPERATIONAL</text>
    </g>

    <!-- Subtitle Prompt -->
    <text x="48" y="104" font-family="'JetBrains Mono', Consolas, monospace" font-size="13.5" font-weight="600" fill="#38BDF8" letter-spacing="2.5">&gt; HELLO WORLD // MEET THE BUILDER</text>

    <!-- Main Name Title with Glowing Neon Gradient -->
    <text x="45" y="170" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" letter-spacing="-1.5" fill="url(#auroraGrad)" filter="url(#neonGlow)">HARSH KOLI</text>

    <!-- Glowing Accent Underline -->
    <rect x="48" y="186" width="460" height="3" rx="1.5" fill="url(#auroraGrad)" />

    <!-- Role Statement -->
    <text x="48" y="218" font-family="'JetBrains Mono', Consolas, monospace" font-size="18" font-weight="700" fill="#F1F5F9">
      FULL-STACK ARCHITECT <tspan fill="#00F5D4">//</tspan> OPEN-SOURCE BUILDER
    </text>

    <!-- Philosophy Tagline -->
    <text x="48" y="248" font-family="'JetBrains Mono', Consolas, monospace" font-size="13.5" fill="#94A3B8">
      Building Attendify, scalable microservices, and telemetry pipelines.
    </text>

    <!-- Interactive Badges Pill Row -->
    <g transform="translate(48, 268)">
      <!-- Badge 1: Attendify -->
      <g class="float-1">
        <rect width="138" height="28" rx="6" fill="#111B34" stroke="#818CF8" stroke-width="1" stroke-opacity="0.7" />
        <circle cx="14" cy="14" r="3.5" fill="#C084FC" />
        <text x="25" y="18.5" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#E0E7FF">ATTENDIFY LEAD</text>
      </g>
      <!-- Badge 2: OpenTelemetry -->
      <g transform="translate(148, 0)" class="float-2">
        <rect width="168" height="28" rx="6" fill="#0C202B" stroke="#00F5D4" stroke-width="1" stroke-opacity="0.7" />
        <circle cx="14" cy="14" r="3.5" fill="#00F5D4" />
        <text x="25" y="18.5" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#CCFBF1">OTEL CONTRIBUTOR</text>
      </g>
      <!-- Badge 3: Distributed Systems -->
      <g transform="translate(326, 0)" class="float-1">
        <rect width="144" height="28" rx="6" fill="#1C182F" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.7" />
        <circle cx="14" cy="14" r="3.5" fill="#F59E0B" />
        <text x="25" y="18.5" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FEF3C7">HIGH-PERF / DSA</text>
      </g>
    </g>

    <!-- Right Side: Futuristic Orbital Reactor Visual -->
    <g opacity="0.95">
      <!-- Ambient Pulsing Glow Circle -->
      <circle cx="790" cy="165" r="115" fill="#0C223C" fill-opacity="0.45" class="pulse-core" filter="url(#softGlow)" />

      <!-- Outer Radar Circle -->
      <circle cx="790" cy="165" r="105" fill="none" stroke="#38BDF8" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="8 6" />

      <!-- Orbit Ring 1 (Clockwise) -->
      <circle cx="790" cy="165" r="88" fill="none" stroke="#00F5D4" stroke-opacity="0.5" stroke-width="1.8" stroke-dasharray="14 12" class="orbit-1" />
      <g class="orbit-1">
        <circle cx="790" cy="77" r="5.5" fill="#00F5D4" filter="url(#neonGlow)" />
        <circle cx="790" cy="253" r="3.5" fill="#38BDF8" />
      </g>

      <!-- Orbit Ring 2 (Counter Clockwise) -->
      <circle cx="790" cy="165" r="68" fill="none" stroke="#C084FC" stroke-opacity="0.65" stroke-width="1.5" stroke-dasharray="6 8" class="orbit-2" />
      <g class="orbit-2">
        <circle cx="790" cy="97" r="4.5" fill="#C084FC" filter="url(#neonGlow)" />
        <circle cx="722" cy="165" r="3" fill="#818CF8" />
      </g>

      <!-- Inner High-Tech Hex Core -->
      <circle cx="790" cy="165" r="48" fill="#0B1329" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.9" />

      <!-- Core Icon Symbol: Code Brackets </> -->
      <path d="M 770 152 L 755 165 L 770 178 M 810 152 L 825 165 L 810 178 M 798 144 L 782 186" fill="none" stroke="url(#auroraGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Crosshair HUD elements -->
      <path d="M 660 165 L 635 165 M 920 165 L 945 165 M 790 40 L 790 15 M 790 290 L 790 315" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1.5" />
      <text x="790" y="298" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#7DD3FC" text-anchor="middle" letter-spacing="2">[ CORE ARCHITECTURE ]</text>
    </g>

    <!-- Top Right HK Tag -->
    <text x="960" y="44" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#64748B" text-anchor="end">HK // v2.6.0</text>

    <!-- Sweeping Laser Scan Line -->
    <rect x="0" y="0" width="1000" height="3" fill="url(#auroraGrad)" opacity="0.65" class="laser-line" />
  </g>
</svg>
