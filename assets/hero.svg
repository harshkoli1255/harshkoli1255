<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="335" viewBox="0 0 1000 335" role="img" aria-label="Harsh Koli futuristic developer banner">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070b17"/><stop offset=".55" stop-color="#0d1027"/><stop offset="1" stop-color="#050b13"/></linearGradient>
 <linearGradient id="neon"><stop stop-color="#73ffcf"/><stop offset=".48" stop-color="#61c6ff"/><stop offset="1" stop-color="#bf8bff"/></linearGradient>
 <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#54bbcb" stroke-width=".7" opacity=".16"/></pattern>
 <filter id="glow" x="-40%" y="-60%" width="180%" height="220%"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <clipPath id="crop"><rect width="1000" height="335" rx="20"/></clipPath>
</defs>
<style>
 .glow { animation: breathe 3s ease-in-out infinite alternate; transform-origin: 775px 155px; }
 .orbit { animation: spin 14s linear infinite; transform-origin: 780px 157px; }
 .orbit2 { animation: spin 21s linear infinite reverse; transform-origin: 780px 157px; }
 .scan {animation: sweep 7s linear infinite;}
 .cursor {animation: blink 1s steps(1) infinite;}
 .line1{animation: rise 4s ease-in-out infinite alternate;}.line2{animation: rise 5s ease-in-out infinite alternate-reverse;}
 .dot1 {animation: blink 1.8s ease-in-out infinite alternate;}.dot2 {animation: blink 2.3s ease-in-out infinite alternate-reverse;}
 @keyframes spin{to{transform:rotate(360deg)}}
 @keyframes breathe{to{opacity:.52;transform:scale(1.045)}}
 @keyframes sweep{0%{transform:translateY(-345px)}100%{transform:translateY(345px)}}
 @keyframes blink{50%{opacity:.15}}
 @keyframes rise{to{transform:translateY(-10px)}}
 @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g clip-path="url(#crop)">
<rect width="1000" height="335" fill="url(#bg)"/><rect width="1000" height="335" fill="url(#grid)"/>
<path d="M0 42H1000M0 297H1000" stroke="#8bfde0" stroke-opacity=".22"/>
<rect x="18" y="18" width="964" height="299" rx="14" fill="none" stroke="#79d9f6" stroke-opacity=".28"/>
<rect x="45" y="32" width="145" height="24" rx="12" fill="#102b36" stroke="#2d6c70"/><circle cx="60" cy="44" r="4" fill="#72ffbf" class="dot1"/><text x="73" y="49" font-family="monospace" font-size="12" fill="#b9ffdf">SYSTEM ONLINE</text>
<text x="46" y="95" font-family="monospace" letter-spacing="3" font-size="14" fill="#80e9c5">&gt; INITIALIZING PORTFOLIO...</text>
<text x="43" y="161" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="900" letter-spacing="-2" fill="url(#neon)" filter="url(#glow)">HARSH KOLI</text>
<rect x="48" y="175" width="425" height="2" fill="url(#neon)"/>
<text x="47" y="207" font-family="monospace" font-size="19" fill="#f0f4ff">FULL-STACK BUILDER <tspan fill="#7affe1">//</tspan> OPEN SOURCE</text>
<text x="47" y="241" font-family="monospace" font-size="15" fill="#95a8c7">Turning coffee + curiosity into shipped code<tspan class="cursor" fill="#70ffda">_</tspan></text>
<rect x="47" y="264" width="111" height="27" rx="6" fill="#102833" stroke="#3bd2bd" stroke-opacity=".65"/><text x="62" y="282" font-family="monospace" font-size="11" fill="#98f7dd">BUILD. BREAK.</text>
<rect x="167" y="264" width="113" height="27" rx="6" fill="#191733" stroke="#8b75e7" stroke-opacity=".65"/><text x="184" y="282" font-family="monospace" font-size="11" fill="#d7c6ff">LEARN. REPEAT.</text>
<g opacity=".9">
<circle cx="780" cy="157" r="110" fill="#0c2431" opacity=".44" class="glow"/>
<circle cx="780" cy="157" r="93" fill="none" stroke="#72f5d4" stroke-opacity=".34" stroke-width="1.6" stroke-dasharray="9 10" class="orbit"/>
<circle cx="780" cy="157" r="72" fill="none" stroke="#a68cff" stroke-opacity=".55" stroke-width="1.4" stroke-dasharray="4 8" class="orbit2"/>
<circle cx="780" cy="157" r="52" fill="#0a1727" stroke="#61d8e9" stroke-opacity=".9" stroke-width="2"/>
<path d="M760 143l-15 14 15 14M800 143l15 14-15 14M791 135l-19 44" fill="none" stroke="url(#neon)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<g class="orbit"><circle cx="780" cy="64" r="6" fill="#72ffd6" filter="url(#glow)"/></g>
<g class="orbit2"><circle cx="780" cy="85" r="5" fill="#bc91ff"/></g>
<path d="M666 157H640M895 157h28M780 42V26M780 272v18" stroke="#84e5e0" stroke-opacity=".5"/>
<text x="686" y="295" font-family="monospace" font-size="10" fill="#81aebe">[ CODE / CREATE / CONTRIBUTE ]</text>
</g>
<g class="line1" opacity=".8"><rect x="569" y="85" width="72" height="5" rx="2" fill="#5fe8c6"/><rect x="584" y="99" width="53" height="4" rx="2" fill="#5d8bc5"/></g>
<g class="line2" opacity=".8"><rect x="893" y="222" width="54" height="5" rx="2" fill="#a48efa"/><rect x="905" y="234" width="42" height="4" rx="2" fill="#5dd7d6"/></g>
<rect x="0" y="0" width="1000" height="4" fill="url(#neon)" opacity=".5" class="scan"/>
<text x="897" y="49" font-family="monospace" font-size="11" fill="#7e99ac">HK // 001</text>
</g></svg>
