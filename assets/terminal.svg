<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="195" viewBox="0 0 1000 195" role="img" aria-label="Animated terminal with Harsh Koli developer information">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1421"/><stop offset="1" stop-color="#12112a"/></linearGradient></defs>
